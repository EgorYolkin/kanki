name: Kanki
options:
  deploymentTarget:
    iOS: '17.0'
    macOS: '14.0'
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: '6.0'
    GENERATE_INFOPLIST_FILE: YES
    PRODUCT_BUNDLE_IDENTIFIER: app.kanki.ios
    # Симулятору подпись не нужна; на устройстве ключ остаётся YES, иначе
    # Xcode собирает неподписанный .app и отказывается его запускать.
    'CODE_SIGNING_ALLOWED[sdk=iphonesimulator*]': NO
    # iOS-only: семейство устройств к macOS не относится.
    'TARGETED_DEVICE_FAMILY[sdk=iphone*]': '1,2'
targets:
  Kanki:
    type: application
    platform: iOS
    supportedDestinations: [iOS, macOS]
    sources:
      - path: Kanki
        excludes:
          - "**/*.md"
    settings:
      base:
        ASSETCATALOG_COMPILER_GENERATE_SWIFT_ASSET_SYMBOL_EXTENSIONS: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: NO
        # macOS: свой идентификатор и ad-hoc подпись, чтобы приложение
        # запускалось локально без Team ID.
        'PRODUCT_BUNDLE_IDENTIFIER[sdk=macosx*]': app.kanki.macos
        'CODE_SIGN_IDENTITY[sdk=macosx*]': "-"
    info:
      path: Kanki/Info.plist
      properties:
        CFBundleDevelopmentRegion: $(DEVELOPMENT_LANGUAGE)
        CFBundleExecutable: $(EXECUTABLE_NAME)
        CFBundleIdentifier: $(PRODUCT_BUNDLE_IDENTIFIER)
        CFBundleInfoDictionaryVersion: "6.0"
        CFBundleName: $(PRODUCT_NAME)
        CFBundlePackageType: $(PRODUCT_BUNDLE_PACKAGE_TYPE)
        CFBundleShortVersionString: "0.1.0"
        CFBundleVersion: "1"
        LSApplicationCategoryType: public.app-category.productivity
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UILaunchScreen: {}
    scheme:
      testTargets:
        - KankiTests
        - KankiUITests
      gatherCoverageData: true
      coverageTargets:
        - Kanki
  KankiTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: KankiTests
        excludes:
          - "**/*.md"
    dependencies:
      - target: Kanki
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.kanki.ios.tests
  KankiUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: KankiUITests
        excludes:
          - "**/*.md"
    dependencies:
      - target: Kanki
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.kanki.ios.uitests
  KankiMacUITests:
    type: bundle.ui-testing
    platform: macOS
    sources:
      - path: KankiMacUITests
        excludes:
          - "**/*.md"
    dependencies:
      - target: Kanki
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.kanki.macos.uitests
schemes:
  'Kanki macOS':
    build:
      targets:
        Kanki: all
        KankiMacUITests: [test]
    run:
      config: Debug
    test:
      config: Debug
      gatherCoverageData: false
      targets:
        - KankiMacUITests
