name: Kanki
options:
  deploymentTarget:
    iOS: '17.0'
settings:
  base:
    SWIFT_VERSION: '6.0'
    TARGETED_DEVICE_FAMILY: '1,2'
    GENERATE_INFOPLIST_FILE: YES
    PRODUCT_BUNDLE_IDENTIFIER: app.kanki.ios
    # Симулятору подпись не нужна; на устройстве ключ остаётся YES, иначе
    # Xcode собирает неподписанный .app и отказывается его запускать.
    'CODE_SIGNING_ALLOWED[sdk=iphonesimulator*]': NO
targets:
  Kanki:
    type: application
    platform: iOS
    sources:
      - path: Kanki
    settings:
      base:
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        ASSETCATALOG_COMPILER_GENERATE_SWIFT_ASSET_SYMBOL_EXTENSIONS: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
  KankiTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: KankiTests
    dependencies:
      - target: Kanki
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
  KankiUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: KankiUITests
    dependencies:
      - target: Kanki
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
